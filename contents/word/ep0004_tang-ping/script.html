<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EP0004 躺平 Script</title>
<style>
:root{--bg:#f0e4cc;--bg2:#e8d8b8;--ink:#2a1a0a;--mid:#6e4a26;--acc:#be501e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Serif SC',serif;max-width:860px;margin:0 auto;padding:24px 16px 64px}
header{text-align:center;padding:36px 0 28px;border-bottom:2px solid var(--acc);margin-bottom:28px}
header .word{font-size:3rem;font-weight:700;color:var(--acc)}
header .pinyin{font-size:1.3rem;color:var(--mid);margin-top:6px}
header .desc{font-size:.95rem;color:var(--mid);opacity:.8;margin-top:4px}
.sec{font-size:1.5rem;color:var(--acc);margin:36px 0 14px;padding-bottom:4px;border-bottom:1px solid #c8a878}
.block{background:var(--bg2);border-radius:10px;padding:14px 16px;margin-bottom:12px;position:relative}
.meta{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.badge{font-size:.7rem;font-weight:700;padding:2px 9px;border-radius:20px;color:#fff}
.b-open{background:#5a7a3a}.b-sec{background:#4a6090}
.b-first{background:var(--acc)}.b-second{background:#7a5030}
.b-full{background:#4a6090}.b-review{background:#3a6060}
.card-ref{font-size:.8rem;color:var(--mid);opacity:.7}
.narration{font-size:1.05rem;line-height:1.85}
.note{margin-top:10px;padding:8px 12px;background:rgba(0,0,0,.06);border-left:3px solid var(--acc);border-radius:4px;font-size:.9rem;color:var(--mid)}
.copy-btn{position:absolute;top:10px;right:12px;font-size:.75rem;padding:3px 10px;border:1px solid var(--acc);border-radius:6px;background:transparent;color:var(--acc);cursor:pointer}
.copy-btn:active{background:var(--acc);color:#fff}
.tabs{position:fixed;top:14px;right:14px;z-index:50;display:flex;gap:6px;background:rgba(240,228,204,.92);padding:6px;border-radius:24px;box-shadow:0 2px 10px rgba(0,0,0,.15);backdrop-filter:blur(4px)}
.tab{font-family:inherit;font-size:.85rem;font-weight:700;cursor:pointer;border:1px solid var(--acc);background:transparent;color:var(--acc);padding:6px 14px;border-radius:20px;transition:all .15s}
.tab.active{background:var(--acc);color:#fff}
@media (max-width:600px){.tabs{top:8px;right:8px;padding:4px;gap:4px}.tab{font-size:.75rem;padding:5px 10px}}
</style>
</head>
<body>
<nav class="tabs" id="tabs"></nav>
<header>
  <div class="word">躺平</div>
  <div class="pinyin">tǎng píng</div>
  <div class="desc">opting out of the rat race</div>
</header>

<div id="cards"></div>

<script src="scripts.js"></script>
<script>
let curStyle = 'A';
const SEC_BADGE = { 'badge-open':'b-open','badge-sec':'b-sec','badge-first':'b-first','badge-second':'b-second','badge-full':'b-full','badge-review':'b-review' };

function render() {
  const root = document.getElementById('cards');
  let html = '';
  for (const c of CARDS) {
    if (c.section) html += '<h2 class="sec">' + c.section + '</h2>';
    html += '<div class="block">'
          +   '<div class="meta"><span class="badge ' + SEC_BADGE[c.cls] + '">' + c.badge + '</span>'
          +     '<span class="card-ref">📌 ' + c.img + '</span></div>'
          +   '<div class="narration">' + narrHtml(c.id, curStyle) + '</div>'
          +   '<button class="copy-btn" data-id="' + c.id + '" onclick="copyCard(this)">복사</button>'
          + '</div>';
  }
  root.innerHTML = html;
}

function copyCard(btn) {
  const text = narrText(btn.dataset.id, curStyle);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓';
    setTimeout(() => btn.textContent = '복사', 1500);
  });
}

function buildTabs() {
  const nav = document.getElementById('tabs');
  nav.innerHTML = STYLES.map(s =>
    '<button class="tab' + (s.id === curStyle ? ' active' : '') + '" data-s="' + s.id + '">' + s.label + '</button>'
  ).join('');
  nav.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      curStyle = btn.dataset.s;
      nav.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.s === curStyle));
      render();
    });
  });
}

buildTabs();
render();
</script>
</body>
</html>
